<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
<defs>
 <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061321"/><stop offset=".35" stop-color="#16415a"/><stop offset=".68" stop-color="#0a263b"/><stop offset="1" stop-color="#030b15"/></linearGradient>
 <linearGradient id="glacier" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#f0fcff" stop-opacity=".76"/><stop offset=".24" stop-color="#a9e4f8" stop-opacity=".42"/><stop offset=".55" stop-color="#397f9e" stop-opacity=".12"/><stop offset="1" stop-color="#061827" stop-opacity="0"/></linearGradient>
 <linearGradient id="iceface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dff8ff" stop-opacity=".55"/><stop offset=".5" stop-color="#75b9d4" stop-opacity=".18"/><stop offset="1" stop-color="#071827" stop-opacity=".05"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#d8f6ff" stop-opacity=".5"/><stop offset="1" stop-color="#8edcff" stop-opacity="0"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="48"/></filter>
 <filter id="fine"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect width="1920" height="1080" fill="url(#ice)"/>
<ellipse cx="420" cy="300" rx="680" ry="420" fill="url(#light)" filter="url(#soft)"/>
<ellipse cx="1480" cy="820" rx="620" ry="360" fill="url(#light)" opacity=".55" filter="url(#soft)"/>
<!-- Broad sculpted glacier wall: irregular ice shelves, not geometric crystal symbols. -->
<path d="M-100 740 C120 650 190 490 360 450 C500 420 570 510 700 450 C850 380 900 220 1080 250 C1240 270 1300 390 1440 330 C1600 260 1720 350 2020 170 L2020 1080H-100Z" fill="url(#glacier)" opacity=".72"/>
<path d="M-80 760 C160 690 220 560 390 520 C530 485 590 580 720 520 C880 445 930 300 1080 320 C1240 345 1300 455 1450 390 C1630 315 1770 410 2010 245" fill="none" stroke="#d9f7ff" stroke-opacity=".32" stroke-width="5"/>
<path d="M-40 860 L260 610 420 660 610 470 760 560 940 350 1100 420 1280 250 1450 360 1650 190 1960 300" fill="none" stroke="#b7eaff" stroke-opacity=".16" stroke-width="28" filter="url(#fine)"/>
<path d="M80 1080 L360 720 520 760 700 560 840 650 1030 430 1180 500 1360 340 1510 430 1740 260 1920 340V1080Z" fill="url(#iceface)" opacity=".36"/>
<path d="M-60 920 Q260 770 470 830 T900 730 T1350 700 T1990 540" fill="none" stroke="#bceeff" stroke-opacity=".14" stroke-width="3"/>
<!-- Fine frozen striations and scattered ice dust, no repeating diamond pattern. -->
<g fill="none" stroke="#d9f6ff" stroke-opacity=".12" stroke-width="2">
 <path d="M90 160L360 360 M180 80L500 330 M1160 90L1420 290 M1320 40L1600 250 M760 820L990 980"/>
 <path d="M260 1080L520 790 M520 1080L730 820 M1510 1080L1700 820 M1660 1080L1850 850"/>
</g>
<g fill="#e9fbff">
 <circle cx="230" cy="180" r="2" opacity=".75"/><circle cx="560" cy="870" r="2.5" opacity=".5"/><circle cx="1190" cy="230" r="2" opacity=".65"/><circle cx="1690" cy="720" r="2.5" opacity=".55"/><circle cx="1450" cy="400" r="1.7" opacity=".7"/><circle cx="850" cy="180" r="1.5" opacity=".55"/>
</g>
<rect width="1920" height="1080" fill="#03101b" opacity=".12"/>
</svg>